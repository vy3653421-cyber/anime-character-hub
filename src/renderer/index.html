<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desktop Mate</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; background: transparent; }
      body { display: grid; place-items: center; overflow: hidden; }
      .shell { width: min(92vw, 480px); padding: 28px; border: 1px solid rgba(255,255,255,.14); border-radius: 28px; background: rgba(16,16,22,.9); backdrop-filter: blur(24px); box-shadow: 0 24px 80px rgba(0,0,0,.45); }
      .badge { display: inline-block; padding: 6px 10px; border-radius: 999px; background: rgba(120,170,255,.12); color: #bcd4ff; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: 14px 0 8px; font-size: 30px; }
      p { margin: 0; color: #aaaab4; line-height: 1.55; }
      #status { margin-top: 18px; font-size: 13px; color: #d7d7df; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
      .card { padding: 12px; border: 1px solid rgba(255,255,255,.09); border-radius: 16px; background: rgba(255,255,255,.035); }
      .label { color: #858590; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
      .value { margin-top: 5px; font-size: 13px; }
      .pending { color: #e8d59a; }
      .ready { color: #a8e0b0; }
    </style>
  </head>
  <body>
    <main class="shell">
      <span class="badge">Runtime foundation</span>
      <h1>Desktop Mate</h1>
      <p>Secure desktop runtime is online. Production capabilities are enabled only after their real implementations and verification are present.</p>
      <div id="status">Checking runtime…</div>
      <section class="grid" id="capabilities" aria-label="Runtime capabilities"></section>
    </main>
    <script>
      const status = document.getElementById("status");
      const capabilities = document.getElementById("capabilities");
      const render = (label, enabled, reason) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `<div class="label">${label}</div><div class="value ${enabled ? "ready" : "pending"}">${enabled ? "Ready" : "Not installed"}</div>`;
        if (reason) card.title = reason;
        capabilities.appendChild(card);
      };

      window.desktopMate?.getStatus().then((value) => {
        status.textContent = value.ready ? `Runtime ready · v${value.version}` : "Runtime unavailable";
      }).catch(() => {
        status.textContent = "IPC unavailable";
      });

      window.desktopMate?.getCapabilities().then((value) => {
        render("3D avatar", value.avatar.enabled, value.avatar.reason);
        render("AI agent", value.ai.enabled, value.ai.reason);
        render("Voice", value.voice.enabled);
        render("Desktop tools", value.desktopTools.enabled, value.desktopTools.reason);
      }).catch(() => {
        status.textContent = "Capability service unavailable";
      });
    </script>
  </body>
</html>
