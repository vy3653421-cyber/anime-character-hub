name: Desktop Mate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install system runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm install
      - name: Verify Electron sandbox helper when available
        run: |
          sandbox="node_modules/electron/dist/chrome-sandbox"
          if [ -f "$sandbox" ]; then
            sudo chown root:root "$sandbox"
            sudo chmod 4755 "$sandbox"
            echo "Electron sandbox helper configured."
          else
            echo "Electron sandbox helper is not shipped by this Electron package; continuing because the smoke runner has a Linux no-sandbox fallback."
          fi
      - run: npm test
      - name: Typecheck main process
        run: npm run build:main
      - name: Build renderer
        run: npm run build:renderer
      - run: npm run perf
      - run: node scripts/security-check.mjs
      - name: Package application directory
        run: npm run package:dir
      - name: Electron startup smoke test
        run: xvfb-run -a node scripts/smoke-electron.mjs
