name: Desktop Mate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install system runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm install
      - name: Verify Electron sandbox helper when available
        run: |
          sandbox="node_modules/electron/dist/chrome-sandbox"
          if [ -f "$sandbox" ]; then
            sudo chown root:root "$sandbox"
            sudo chmod 4755 "$sandbox"
            echo "Electron sandbox helper configured."
          else
            echo "Electron sandbox helper is not shipped by this Electron package; continuing because the smoke runner has a Linux no-sandbox fallback."
          fi
      - run: npm test
      - name: Typecheck main process
        run: npm run build:main
      - name: Build renderer
        run: npm run build:renderer
      - run: npm run perf
      - run: node scripts/security-check.mjs
      - name: Package application directory
        run: npm run package:dir
      - name: Verify packaged runtime assets
        run: npm run validate:packaged-assets
      - name: Electron startup smoke test
        run: xvfb-run -a node scripts/smoke-electron.mjs

  cross-platform-package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - name: Build and package Windows installer
        if: matrix.os == 'windows-latest'
        run: npm run package
      - name: Build and package macOS application directory
        if: matrix.os == 'macos-latest'
        run: npm run package:dir
      - name: Verify packaged runtime assets
        run: npm run validate:packaged-assets
      - name: Upload Windows NSIS installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mate-windows-installer
          path: release/*.exe
          if-no-files-found: error
      - name: Upload macOS packaged application
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mate-macos-latest
          path: |
            dist/*-unpacked
            dist/*
          if-no-files-found: error
