name: Desktop Mate Avatar Validation

on:
  push:
    branches: [main]
    paths:
      - "public/assets/avatar/**"
      - "scripts/validate-avatar-glb.mjs"
  pull_request:
    branches: [main]
    paths:
      - "public/assets/avatar/**"
      - "scripts/validate-avatar-glb.mjs"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/validate-avatar-glb.mjs
